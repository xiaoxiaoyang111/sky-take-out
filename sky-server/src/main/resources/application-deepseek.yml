# Activate together with dev for local use; credentials are read only from process environment.
rental:
  assistant:
    enabled: true
    endpoint: https://api.deepseek.com/chat/completions
    api-key: ${DEEPSEEK_API_KEY:${RENTAL_ASSISTANT_API_KEY:}}
    model: ${DEEPSEEK_MODEL:deepseek-flash}
    token-field: max_tokens
    disable-thinking: true
